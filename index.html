<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzmez2icd-yy_FkRWJjsXhVSd0FZzcRUAo4LV-fyAQDDPBVK_6FUS3OnYbO3LdVObFATg/exec"; 

  const cameraInput = document.getElementById("cameraInput");
  const statusDiv = document.getElementById("status");

  cameraInput.addEventListener("change", function(e) {
    const file = e.target.files[0];
    if (!file) return;

    statusDiv.textContent = "Processing full-res media...";

    const reader = new FileReader();
    reader.onload = function(evt) {
      // Extract raw base64 data without canvas compression
      const rawBase64 = evt.target.result.split(',')[1];

      statusDiv.textContent = "Uploading to Drive...";

      const payload = {
        file: rawBase64,
        name: `DOC_${Date.now()}_${file.name}`,
        mimeType: file.type || "image/jpeg"
      };

      fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          statusDiv.textContent = "✅ Upload complete! Saved in full quality.";
        } else {
          statusDiv.textContent = "❌ Upload failed: " + data.message;
        }
      })
      .catch(err => {
        statusDiv.textContent = "❌ Error uploading file.";
        console.error("Upload error:", err);
      })
      .finally(() => {
        cameraInput.value = "";
      });
    };

    reader.readAsDataURL(file);
  });
</script>
